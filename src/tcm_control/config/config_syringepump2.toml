[serial]
port = "COM4"
baudrate = 9600
timeout_s = 0.2
pump_address = 2
command_delay_s = 0.2

active_profile = "has_20ml_1913mm"

[pump]
rate_unit = "m/m"
volume_unit = "m"
status_poll_s = 1.0
phase_timeout_s = 3600

[profiles.has_20ml_1913mm]
vendor_code = "has"
volume_ml = 20.0
diameter_mm = 19.13
gang = 1
force_percent = 100

[profiles.bdp_60ml_26594mm_gang2]
vendor_code = "bdp"
volume_ml = 60.0
diameter_mm = 26.594
gang = 2
force_percent = 100

[profiles.custom]
vendor_code = "has"
volume_ml = 20.0
diameter_mm = 19.13
gang = 1
force_percent = 100

[[infuse]]
volume_ml = 0.5
rate_ml_min = 6

[[withdraw]]
volume_ml = 0.5
rate_ml_min = 5
