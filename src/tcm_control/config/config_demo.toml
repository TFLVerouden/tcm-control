[experiment]
name = "demo" # keep empty to prompt
mode = "droplet" # droplet | film | piv
series_directory = "None" # keep empty to prompt; set to "None" to disable saving data

[inputs.cough]
debug_mode = false
nr_runs = 10
multi_run_interval_s = 0
confirm_before_starting_next_run = true
record_droplet_size = false

[devices.cough_machine.inputs]
flow_curve_csv_path = "step300ms"
wait_before_run_ms = 59.5

[devices.cough_machine.inputs.tank]
pressure_bar = 1.5
settling_time_s = 60.0
avg_window_s = 1.0
tolerance_bar = 0.2
poll_interval_s = 0.2
intermediate_diff_bar = "" # set together with intermediate_time_s (empty disables)
intermediate_time_s = "" # set together with intermediate_diff_bar (empty disables)

[devices.pump.inputs]
syringe_volume_ml = 2.5
pump_rate_ml_per_min = 0.1
nr_droplets_to_skip_before_recording = 0