[experiment]
name = "" # keep empty to prompt
mode = "film" # droplet | film | piv
series_directory = "None" # keep empty to prompt; set to "None" to disable saving data

[inputs.cough]
debug_mode = false
nr_runs = 1
multi_run_interval_s = 40
confirm_before_starting_next_run = false
record_droplet_size = false

[devices.cough_machine.inputs]
flow_curve_csv_path = "gupta_71kg_1-94m"
wait_before_run_ms = 0

[devices.cough_machine.inputs.cleaning]
cycle_count = 0

[devices.cough_machine.inputs.tank]
pressure_bar = 2.5
settling_time_s = 60.0
avg_window_s = 5.0
tolerance_bar = 0.05
poll_interval_s = 0.2
intermediate_diff_bar = -0.1 # set together with intermediate_time_s (empty disables)
intermediate_time_s = 2 # set together with intermediate_diff_bar (empty disables)

[devices.pump.syringe]
syringe_vendor_code = "hm2"
syringe_volume_mL = 100.0
syringe_diameter_mm = 32.573
syringe_gang = 1
syringe_force_percent = 100

[devices.pump.layer]
film_settling_time_s = 10
infuse_volume_ml = 3.6
infuse_rate_ml_min = 15
withdraw_volume_ml = 2.2
withdraw_rate_ml_min = 5

[devices.camera.inputs]
camera_exposure_us = 4000
pixel_per_meter = 0.015678e-3

[devices.pump.clean_tube]
volume_ml_layer = 3
rate_ml_min_layer = 15
volume_ml_repetition = 0.5
rate_ml_min_repetition = 5
repetitions = 5