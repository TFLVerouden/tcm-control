[experiment]
name = "" # keep empty to prompt
mode = "piv" # droplet | film | piv
series_directory = "C:\CoughMachineData\260630_piv\tests" # keep empty to prompt; set to "None" to disable saving data

[inputs.cough]
debug_mode = false
nr_runs = 1
multi_run_interval_s = 0
confirm_before_starting_next_run = true
record_droplet_size = false

[devices.cough_machine.inputs]
flow_curve_csv_path = "step_20-0mA_500ms"
wait_before_run_ms = 0

[devices.cough_machine.inputs.cleaning]
clean_pressure_bar = 4.0
valve_open_duration_s = 2.5
cycle_count = 3

[devices.cough_machine.inputs.tank]
pressure_bar = 3.0
settling_time_s = 60.0
avg_window_s = 5.0
tolerance_bar = 0.05
poll_interval_s = 0.2
intermediate_diff_bar = -0.1 # set together with intermediate_time_s (empty disables)
intermediate_time_s = 2 # set together with intermediate_diff_bar (empty disables)

[devices.pump.inputs]
syringe_volume_ml = 2.5
pump_rate_ml_per_min = 1.0
piv_pump_start_before_run_s = 0.5
piv_pump_stop_after_run_s = 0.0
piv_nebuliser_pressure_bar = 0.5
